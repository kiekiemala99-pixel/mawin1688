services:
  - type: web
    name: mawin1688
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:host
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STAFF_PHONES
        sync: false
